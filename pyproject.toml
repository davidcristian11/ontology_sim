[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologysim"
version = "0.1.0"
description = "Automotive Data + AI Proof of Concept"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "databricks-sql-connector>=4.6.0",
    "neo4j>=6.4.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]
